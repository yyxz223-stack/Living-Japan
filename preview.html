<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Japan · 隔离预览</title><link rel="stylesheet" href="style.css"><style>body{margin:0;background:#e6e7e2;color:#283c34;font:14px/1.6 "Microsoft YaHei",sans-serif}header{padding:10px 16px}header b{margin-right:14px}main{padding:8px 16px;max-width:850px}textarea{width:100%;height:90px;box-sizing:border-box;padding:10px;font:inherit}button{font:inherit;margin:5px 7px 5px 0;padding:6px 12px}#living-japan-shell,#living-japan-shell[data-layout="mobile"]{inset:0 0 150px;height:auto}#living-japan-shell[data-layout="mobile"]{left:50%;right:auto;width:min(430px,100vw);transform:translateX(-50%)}#living-japan-shell[data-layout="portrait"]{top:calc((100vh - 150px)/2);height:min(860px,calc(100vh - 160px))}#preview-input{position:fixed;bottom:0;left:0;right:0;height:140px;padding:5px 16px;box-sizing:border-box}#send_textarea{height:72px}#previewStatus{font-size:12px;color:#5b6966}</style></head><body>
<header><b>Living Japan 隔离预览</b><span>保存到本机预览目录；不连接真实聊天或模型。</span></header>
<main><button id="openApp">打开工作区</button><p id="previewStatus">正在初始化…</p></main>
<section id="preview-input"><textarea id="send_textarea" aria-label="隔离聊天输入框" placeholder="手动追加会保留这里的文字。可输入地点名称，再点“模拟宏展开”。"></textarea><div><button id="simulate">模拟宏展开</button><button id="layoutDesktop">横版</button><button id="layoutPortrait">竖版</button><button id="layoutMobile">手机</button><span id="outputCount"></span></div></section>
<script type="module" src="./scripts/preview-host.js"></script></body></html>
